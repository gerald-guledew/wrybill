[package]
name = "wrybill-cli"
description = "The wrybill command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A library as well as a binary, so the pieces can be tested without
# starting a process.
[lib]
name = "wrybill_cli"
path = "src/lib.rs"

# The command is always `wrybill`, never shortened (spec 7.5).
[[bin]]
name = "wrybill"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rpassword.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wrybill-config.workspace = true
wrybill-tools.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
